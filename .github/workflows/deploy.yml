name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-and-deploy:
    uses: freegamestore-online/ci-workflows/.github/workflows/game-ci.yml@main
    with:
      cf_project: neon-runner
    permissions:
      contents: read
      deployments: write
    secrets: inherit
